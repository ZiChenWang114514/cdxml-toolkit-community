<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">cdxml-toolkit-community</title>
  <desc id="desc">A community MCP and Python runtime that turns grounded chemistry requests into verified, editable ChemDraw and Office artifacts.</desc>

  <rect width="1200" height="420" rx="8" fill="#f6f6f1"/>
  <rect x="0" y="0" width="14" height="420" fill="#c53f4e"/>
  <path d="M54 45H1146" stroke="#c9cbc5" stroke-width="2"/>
  <text x="56" y="33" fill="#5e666a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">CHEMDRAW + MCP / COMMUNITY RUNTIME</text>
  <text x="1144" y="33" text-anchor="end" fill="#5e666a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">v0.7</text>

  <g id="identity" transform="translate(56 82)">
    <text x="0" y="64" fill="#17191c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="66" font-weight="760">cdxml-toolkit</text>
    <text x="2" y="111" fill="#c53f4e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700">community</text>
    <text x="2" y="165" fill="#34393c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23">
      Ground chemistry. Verify changes. Publish editable artifacts.
    </text>
  </g>

  <text x="650" y="67" fill="#157d7f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">CHEMDRAW NATIVE CASE / KL-CC-001</text>

  <g id="specification" transform="translate(56 350)">
    <text x="0" y="28" fill="#17191c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">35 MCP TOOLS</text>
    <path d="M170 7V32M368 7V32M624 7V32" stroke="#b5b8b2" stroke-width="2"/>
    <text x="194" y="28" fill="#17191c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">5 PROFILES</text>
    <text x="392" y="28" fill="#17191c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">PYTHON 3.10–3.13</text>
    <text x="648" y="28" fill="#17191c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">STDIO + HTTP</text>
  </g>
</svg>
