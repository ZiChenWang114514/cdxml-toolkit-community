name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install portable test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows,office,analysis,image]"

      - name: Verify package metadata
        shell: pwsh
        run: |
          python -c "import cdxml_toolkit; assert cdxml_toolkit.__version__ == '0.6.0a1'"
          python -c "import importlib.metadata as m; assert m.version('cdxml-toolkit-community') == '0.6.0a1'"

      - name: Run portable tests
        run: python -m pytest -m "not network" -q

  package:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository with LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and inspect distributions
        shell: pwsh
        run: |
          python -m pip install --upgrade build twine
          $jre = Get-Item .\cdxml_toolkit\_jre\temurin-21-jre-win-x64.zip
          if ($jre.Length -lt 40MB) { throw "Bundled JRE is an unresolved LFS pointer." }
          python -m build
          python -m twine check .\dist\*

  mcp-compatibility:
    name: MCP SDK ${{ matrix.mcp-major }}.x
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - mcp-major: "1"
            mcp-spec: "mcp>=1,<2"
          - mcp-major: "2"
            mcp-spec: "mcp>=2,<3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "${{ matrix.mcp-spec }}"

      - name: Run MCP compatibility tests
        run: python -m pytest tests/test_mcp_compat.py -q
