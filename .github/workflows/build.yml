name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository with LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        shell: pwsh
        run: |
          python -m pip install --upgrade build twine
          $jre = Get-Item .\cdxml_toolkit\_jre\temurin-21-jre-win-x64.zip
          if ($jre.Length -lt 40MB) { throw "Bundled JRE is an unresolved LFS pointer." }
          python -m build
          python -m twine check .\dist\*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: cdxml-toolkit-community-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

